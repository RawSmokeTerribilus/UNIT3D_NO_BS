# Arena NOBS · Warzone 2100 — nginx del módulo.
# El gateway le quita el prefijo /arena-app/wz2100/, así que aquí todo cuelga de /.
#   /            sala de espera (lobby/)
#   /cliente/    Web Edition parcheada
#   /salas.json  lista pública de salas (agente → /publico)
#   /yo.json     quién es el socio, según X-Arena-User (la pone el nginx de UNIT3D, nunca el cliente)
#   /ws          puente WebSocket → relé de sesiones reanudables del contenedor de salas (enruta por ?token=salaN)
# Nombres de servicio del compose (iguales en prod y staging): arena-wz2100-salas.

server {
    listen 80;
    resolver 127.0.0.11 valid=30s;

    # La página padre de NOBS (/arena/wz2100) está aislada (gaming.isolation):
    # todo lo que cuelga del iframe tiene que declararse same-origin.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control "private, no-cache" always;
    # CSP (revisión de seguridad H1/H2): solo código propio (shell rehecho por rehacer_shell.py, sin
    # inline), wasm, y conexiones SOLO a las rutas del módulo: el JS del iframe no puede llamar a
    # /api de NOBS ni a terceros (wz2100.net, ipify…). Los style="" sueltos del shell: style-src-attr.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src https://$host/arena-app/wz2100/ wss://$host/arena-app/wz2100/ws; img-src 'self' data: blob:; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    gzip_static on;
    types {
        text/html html;
        application/javascript js mjs;
        application/wasm wasm;
        application/octet-stream data;
        application/json json;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
        text/css css;
    }

    location / {
        root /srv/lobby;
        index index.html;
    }

    location ^~ /cliente/ {
        alias /srv/cliente/;
        index index.html;
    }

    location = /yo.json {
        default_type application/json;
        return 200 '{"socio":"$http_x_arena_user"}';
    }

    location = /salas.json {
        set $agente arena-wz2100-salas:8081;
        proxy_pass http://$agente/publico;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 5s;
    }

    # Salas de socio: presets disponibles, crear la suya y cerrarla. El agente exige X-Arena-User
    # (la pone el nginx de UNIT3D) y X-Requested-With: arena para escribir.
    location = /presets.json {
        limit_except GET { deny all; }
        set $agente arena-wz2100-salas:8081;
        proxy_pass http://$agente/publico/presets;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 5s;
    }

    location = /mis-salas {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        set $agente arena-wz2100-salas:8081;
        proxy_pass http://$agente/publico/salas;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 10s;
    }

    location ~ "^/mis-salas/(sala[0-9]{1,2})$" {
        limit_except DELETE { deny all; }
        set $agente arena-wz2100-salas:8081;
        proxy_pass http://$agente/publico/salas/$1;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 10s;
    }

    location = /ws {
        set $puente arena-wz2100-salas:8080;
        proxy_pass http://$puente;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # El relé ata cada sesión reanudable al socio: solo él puede reengancharse
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
