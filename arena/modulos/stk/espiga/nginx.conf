server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-site always;
    types { text/html html; application/javascript js; application/wasm wasm; application/json json; text/css css; application/gzip gz; }
    location / { root /srv/cliente; index index.html; }
    location = /dg {
        set $r stk-espiga-servidor:8080;
        proxy_pass http://$r;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Arena-User "3:RawSmoke";
        proxy_read_timeout 3600s;
    }
}
