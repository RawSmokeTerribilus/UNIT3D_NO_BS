# Arena NOBS · SuperTuxKart — nginx del módulo.
# El gateway le quita el prefijo /arena-app/stk/, así que aquí todo cuelga de /.
#   /            sala de espera (lobby/)
#   /cliente/    SuperTuxKart web (port de ading2210) + shell propio + datos (.tar.gz)
#   /salas.json  lista pública de salas (agente → /publico)
#   /yo.json     quién es el socio, según X-Arena-User (la pone el nginx de UNIT3D, nunca el cliente)
#   /dg          relé común en modo datagrama (un mensaje WS = un datagrama UDP; ?token=salaN)
# Plantilla del entrypoint de nginx (envsubst SOLO de variables definidas): ARENA_PADRE = origen de
# NOBS que puede enmarcar el módulo.

# Caché: lo que se pide con ?v=<versión> (pk3, datos .tar.gz) no cambia nunca bajo esa URL → el navegador
# lo guarda un año sin revalidar. «private»: Cloudflare no lo guarda (va detrás del pase de la Arena).
# Lo demás (html, js, wasm, json) se revalida siempre, para no mezclar un wasm viejo con un js nuevo.
map $arg_v $arena_cache_stk {
    ''      "private, no-cache";
    default "private, max-age=31536000, immutable";
}

server {
    listen 80;
    resolver 127.0.0.11 valid=30s;

    # El iframe está aislado (la página padre manda COEP): cabeceras de aislamiento y CORP same-site
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Cache-Control $arena_cache_stk always;
    # CSP: solo código propio y wasm; conexiones SOLO a las rutas del módulo (ni /api de NOBS ni terceros)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src https://$host/arena-app/stk/ wss://$host/arena-app/stk/dg; img-src 'self' data: blob:; style-src 'self'; font-src 'self' data:; media-src 'self' blob:; frame-ancestors ${ARENA_PADRE}; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    gzip_static on;
    types {
        text/html html;
        application/javascript js mjs;
        application/wasm wasm;
        application/json json;
        text/css css;
        application/octet-stream pk3;
        application/gzip gz;
        image/png png;
        image/svg+xml svg;
    }

    location / {
        root /srv/lobby;
        index index.html;
    }

    location ^~ /cliente/ {
        alias /srv/cliente/;
        index index.html;
    }

    location = /yo.json {
        default_type application/json;
        return 200 '{"socio":"$http_x_arena_user"}';
    }

    location = /salas.json {
        set $agente arena-stk-salas:8081;
        proxy_pass http://$agente/publico;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 5s;
    }

    location = /presets.json {
        limit_except GET { deny all; }
        set $agente arena-stk-salas:8081;
        proxy_pass http://$agente/publico/presets;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 5s;
    }

    location = /mis-salas {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        set $agente arena-stk-salas:8081;
        proxy_pass http://$agente/publico/salas;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 10s;
    }

    location ~ "^/mis-salas/(sala[0-9]{1,2})$" {
        limit_except DELETE { deny all; }
        set $agente arena-stk-salas:8081;
        proxy_pass http://$agente/publico/salas/$1;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 10s;
    }

    location = /dg {
        set $rele arena-stk-salas:8080;
        proxy_pass http://$rele;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
