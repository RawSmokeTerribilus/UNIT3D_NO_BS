server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    types { text/html html; application/javascript js; application/wasm wasm; application/json json; text/css css; application/octet-stream pk3; }
    location / { root /srv/cliente; index index.html; }
    location = /dg {
        set $r q3-espiga-servidor:8080;
        proxy_pass http://$r;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Arena-User "3:RawSmoke";
        proxy_read_timeout 3600s;
    }
}
