# Arena NOBS — gateway.
# El nginx de UNIT3D manda aquí todo /arena-app/ ya autenticado (auth_request contra
# /__arena/whoami) y con X-Arena-User puesta por él; el navegador nunca llega a este
# contenedor directamente. Añadir un juego = un bloque location más (y su servicio en el compose).
# Se usan nombres de SERVICIO del compose, que son iguales en prod y staging.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=30s;

    # Warzone 2100 — arena/modulos/wz2100
    location ^~ /arena-app/wz2100/ {
        set $up arena-wz2100-web:80;
        rewrite ^/arena-app/wz2100/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /arena-app/q3/ {
        set $up arena-q3-web:80;
        rewrite ^/arena-app/q3/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /arena-app/cs16/ {
        set $up arena-cs16-web:80;
        rewrite ^/arena-app/cs16/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /arena-app/stk/ {
        set $up arena-stk-web:80;
        rewrite ^/arena-app/stk/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Arena-User $http_x_arena_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
