server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.10.0.0/16;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    index index.php;

    charset utf-8;

    # COOP/COEP para SharedArrayBuffer — requerido por Chrome para ScummVM WASM con hilos
    location ^~ /gaming {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Tipo MIME para WebAssembly — requerido para WebAssembly.instantiateStreaming()
    # Sin este tipo, Chrome y Firefox rechazan la compilación del motor ScummVM.
    location ^~ /engine/ {
        types {
            application/wasm  wasm;
            application/javascript  js;
        }
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Datos de los juegos — soporte de rango parcial para archivos grandes
    # Accept-Ranges permite que el VFS de Emscripten haga fseek() via HTTP Range.
    location ^~ /games/ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Launcher JS del arcade — sin caché para facilitar actualizaciones
    location = /js/scummvm-launcher.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ─── RetroArch Web Player ─────────────────────────────────────────────
    # Sibling app aislado: COOP/COEP propios → habilita SharedArrayBuffer +
    # pthreads que requieren los cores libretro (PSX, MAME, etc.) sin
    # arrastrar la cabecera al resto del sitio (rompería avatares/imágenes
    # externas que el tracker carga sin CORP).  El catálogo enlaza con
    # target="_blank" rel="noopener noreferrer" para que el contexto
    # aislado viva sólo en su pestaña.
    location ^~ /retroarch/ {
        # Mime types: explícitos y completos para evitar que el browser
        # se trague el HTML como octet-stream (descarga forzada). Nginx
        # NO fusiona un types{} local con el global — al declarar uno
        # aquí hay que listar TODO lo que se sirve bajo /retroarch/.
        types {
            text/html               html htm;
            text/css                css;
            application/javascript  js;
            application/wasm        wasm;
            application/json        json;
            image/png               png;
            image/jpeg              jpg jpeg;
            image/x-icon            ico;
            image/svg+xml           svg;
            font/woff               woff;
            font/woff2              woff2;
            application/octet-stream  bin bc aa ab ac ad ae;
        }
        default_type application/octet-stream;
        gzip off;

        # Habilita SharedArrayBuffer (cross-origin isolation)
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;

        # Defensa en profundidad — refuerza las cabeceras globales en este
        # subárbol para que los responses de error las hereden también.
        add_header X-Frame-Options              "SAMEORIGIN"    always;
        add_header X-Content-Type-Options       "nosniff"       always;
        add_header Referrer-Policy              "same-origin"   always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=()" always;

        # Cores y assets son inmutables (build dated nightly)
        add_header Cache-Control "public, max-age=86400" always;
        add_header Accept-Ranges bytes                   always;

        # Sólo lectura — el frontend de RA no muta nada en el servidor
        limit_except GET HEAD { deny all; }

        # No PHP aquí: el subárbol es estático puro. Bloquea cualquier
        # intento de ejecución por si se cuela un .php (defensa contra
        # subidas accidentales).
        location ~ \.php$ { deny all; }

        autoindex off;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
