map $http_cf_connecting_ip $announce_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.10.0.0/16;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    index index.php;

    charset utf-8;

    # ─── Auth gate compartida (/retroarch/, /games/, /engine/) ─────────────
    # Endpoint interno que delega la comprobación de sesión a Laravel:
    #   GET /__auth/check  → 204 (autenticado)  | 401 (no autenticado)
    # Definido en routes/web.php sin middleware 'auth' para que devuelva 401
    # limpio en vez de un 302 a /login (auth_request rechaza códigos 3xx).
    # `internal` impide que un cliente externo lo llame: sólo nginx vía
    # auth_request puede dispararlo.
    location = /__auth/check {
        internal;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /__auth/check;
        fastcgi_param DOCUMENT_URI /__auth/check;
        fastcgi_param QUERY_STRING "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # 401 → redirige al login para que el primer pantallazo no sea un error
    # críptico.  Para fetches XHR de ROM/data ya autenticados pero con sesión
    # expirada, el redirect aterriza como contenido raro en el iframe — el
    # usuario recarga y la ruta Laravel del catálogo lo lleva a /login limpio.
    location @gaming_unauth {
        return 302 /login;
    }

    # COOP/COEP para SharedArrayBuffer — requerido por Chrome para ScummVM WASM con hilos
    location ^~ /gaming {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Tipo MIME para WebAssembly — requerido para WebAssembly.instantiateStreaming()
    # Sin este tipo, Chrome y Firefox rechazan la compilación del motor ScummVM.
    location ^~ /engine/ {
        auth_request /__auth/check;
        error_page 401 = @gaming_unauth;
        types {
            application/wasm  wasm;
            application/javascript  js;
        }
        gzip off;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Datos de los juegos — soporte de rango parcial para archivos grandes
    # Accept-Ranges permite que el VFS de Emscripten haga fseek() via HTTP Range.
    location ^~ /games/ {
        auth_request /__auth/check;
        error_page 401 = @gaming_unauth;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=604800" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Launcher JS del arcade — sin caché para facilitar actualizaciones
    location = /js/scummvm-launcher.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ─── RetroArch Web Player ─────────────────────────────────────────────
    # Sibling app aislado: COOP/COEP propios → habilita SharedArrayBuffer +
    # pthreads que requieren los cores libretro (PSX, MAME, etc.) sin
    # arrastrar la cabecera al resto del sitio (rompería avatares/imágenes
    # externas que el tracker carga sin CORP).  El catálogo enlaza con
    # target="_blank" rel="noopener noreferrer" para que el contexto
    # aislado viva sólo en su pestaña.
    location ^~ /retroarch/ {
        auth_request /__auth/check;
        error_page 401 = @gaming_unauth;

        # Mime types: explícitos y completos para evitar que el browser
        # se trague el HTML como octet-stream (descarga forzada). Nginx
        # NO fusiona un types{} local con el global — al declarar uno
        # aquí hay que listar TODO lo que se sirve bajo /retroarch/.
        types {
            text/html               html htm;
            text/css                css;
            application/javascript  js;
            application/wasm        wasm;
            application/json        json;
            image/png               png;
            image/jpeg              jpg jpeg;
            image/x-icon            ico;
            image/svg+xml           svg;
            font/woff               woff;
            font/woff2              woff2;
            application/octet-stream  bin bc aa ab ac ad ae;
        }
        default_type application/octet-stream;
        gzip off;

        # Habilita SharedArrayBuffer (cross-origin isolation)
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;

        # Defensa en profundidad — refuerza las cabeceras globales en este
        # subárbol para que los responses de error las hereden también.
        add_header X-Frame-Options              "SAMEORIGIN"    always;
        add_header X-Content-Type-Options       "nosniff"       always;
        add_header Referrer-Policy              "same-origin"   always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=()" always;

        # Cores y assets son inmutables (build dated nightly)
        add_header Cache-Control "private, max-age=86400" always;
        add_header Accept-Ranges bytes                   always;

        # Sólo lectura — el frontend de RA no muta nada en el servidor
        limit_except GET HEAD { deny all; }

        # No PHP aquí: el subárbol es estático puro. Bloquea cualquier
        # intento de ejecución por si se cuela un .php (defensa contra
        # subidas accidentales).
        location ~ \.php$ { deny all; }

        autoindex off;
        # Estáticos puros ($uri match → fichero); si no existe, cae a
        # Laravel para que RetroArchController atienda
        # /retroarch/, /retroarch/{system} y /retroarch/{system}/{slug}.
        # OJO: SIN `$uri/` — autoindex está apagado, así que un match de
        # directorio devuelve 403 en vez de fallthrough. Saltamos directo
        # a Laravel cuando $uri no resuelve a fichero.
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/announce/[^/]+/(torrents|users|groups|blacklisted-agents|freeleech-tokens|personal-freeleech|featured-torrents|stats|config/reload)$ {
        return 403;
    }

    location ^~ /announce/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $announce_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $announce_client_ip;
        proxy_pass http://announce:6969;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
