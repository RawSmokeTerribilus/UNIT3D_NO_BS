services:
    web:
        image: nginx:alpine
        container_name: unit3d-staging-web
        restart: unless-stopped
        tmpfs:
            - /var/www/html/storage/app/backups:size=10M,mode=777
            - /var/www/html/storage/app/backup-temp:size=2G,mode=777
        ports:
            - "127.0.0.1:${HTTP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
            - announce
        networks:
            - unit3d

    announce:
        build:
            context: .
            dockerfile: .docker/announce/Dockerfile
        container_name: unit3d-staging-announce
        restart: unless-stopped
        environment:
            - DB_USERNAME=${DB_USERNAME:-unit3d}
            - DB_PASSWORD=${DB_PASSWORD:-unit3d}
            - DB_DATABASE=${DB_DATABASE:-unit3d}
            - TRACKER_DB_HOST=db
            - TRACKER_DB_PORT=3306
            - TRACKER_KEY=${TRACKER_KEY}
            - TRACKER_LISTENING_IP_ADDRESS=0.0.0.0
            - TRACKER_LISTENING_PORT=${TRACKER_PORT:-6969}
            - TRACKER_RUST_LOG=${TRACKER_RUST_LOG:-unit3d_announce=info,axum::rejection=off}
            - TRACKER_IS_CONNECTIVITY_CHECK_ENABLED=${TRACKER_IS_CONNECTIVITY_CHECK_ENABLED:-false}
            - TRACKER_CONNECTIVITY_CHECK_INTERVAL=${TRACKER_CONNECTIVITY_CHECK_INTERVAL:-1800}
            - TRACKER_REQUIRE_PEER_CONNECTIVITY=${TRACKER_REQUIRE_PEER_CONNECTIVITY:-false}
            - TRACKER_IS_ANNOUNCE_LOGGING_ENABLED=${TRACKER_IS_ANNOUNCE_LOGGING_ENABLED:-false}
            - TRACKER_REVERSE_PROXY_CLIENT_IP_HEADER_NAME=${TRACKER_REVERSE_PROXY_CLIENT_IP_HEADER_NAME:-X-Real-IP}
            - TRACKER_ANNOUNCE_MIN=${TRACKER_ANNOUNCE_MIN:-1800}
            - TRACKER_ANNOUNCE_MIN_ENFORCED=${TRACKER_ANNOUNCE_MIN_ENFORCED:-1740}
            - TRACKER_ANNOUNCE_MAX=${TRACKER_ANNOUNCE_MAX:-3600}
            - TRACKER_FLUSH_INTERVAL_MILLISECONDS=${TRACKER_FLUSH_INTERVAL_MILLISECONDS:-3000}
            - TRACKER_MAX_BATCHES_PER_FLUSH=${TRACKER_MAX_BATCHES_PER_FLUSH:-1}
            - TRACKER_NUMWANT_DEFAULT=${TRACKER_NUMWANT_DEFAULT:-15}
            - TRACKER_NUMWANT_MAX=${TRACKER_NUMWANT_MAX:-15}
            - TRACKER_UPLOAD_FACTOR=${TRACKER_UPLOAD_FACTOR:-100}
            - TRACKER_DOWNLOAD_FACTOR=${TRACKER_DOWNLOAD_FACTOR:-100}
            - DONOR_DOWNLOAD_FACTOR_OVERRIDE=${DONOR_DOWNLOAD_FACTOR_OVERRIDE:-0}
            - DONOR_UPLOAD_FACTOR_OVERRIDE=${DONOR_UPLOAD_FACTOR_OVERRIDE:-200}
            - DONOR_IMMUNITY_OVERRIDE=${DONOR_IMMUNITY_OVERRIDE:-true}
            - LIFETIME_DONOR_DOWNLOAD_FACTOR_OVERRIDE=${LIFETIME_DONOR_DOWNLOAD_FACTOR_OVERRIDE:-0}
            - LIFETIME_DONOR_UPLOAD_FACTOR_OVERRIDE=${LIFETIME_DONOR_UPLOAD_FACTOR_OVERRIDE:-255}
            - LIFETIME_DONOR_IMMUNITY_OVERRIDE=${LIFETIME_DONOR_IMMUNITY_OVERRIDE:-true}
            - DONOR_UNLIMITED_DOWNLOAD_SLOTS=${DONOR_UNLIMITED_DOWNLOAD_SLOTS:-true}
            - TRACKER_PEER_EXPIRY_INTERVAL=${TRACKER_PEER_EXPIRY_INTERVAL:-1800}
            - TRACKER_ACTIVE_PEER_TTL=${TRACKER_ACTIVE_PEER_TTL:-7200}
            - TRACKER_INACTIVE_PEER_TTL=${TRACKER_INACTIVE_PEER_TTL:-1814400}
            - TRACKER_MAX_PEERS_PER_TORRENT_PER_USER=${TRACKER_MAX_PEERS_PER_TORRENT_PER_USER:-3}
            - TRACKER_USER_RECEIVE_SEED_LIST_RATE_LIMITS=${TRACKER_USER_RECEIVE_SEED_LIST_RATE_LIMITS:-60=10;900=25;7200=125;86400=500;604800=2500}
            - TRACKER_USER_RECEIVE_LEECH_LIST_RATE_LIMITS=${TRACKER_USER_RECEIVE_LEECH_LIST_RATE_LIMITS:-60=20;900=50;7200=250;86400=1000;604800=5000}
        depends_on:
            - db
        networks:
            - unit3d
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6969/announce/health/ping"]
            interval: 30s
            timeout: 5s
            retries: 5

    app:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile.app
        container_name: unit3d-staging-app
        restart: unless-stopped
        tmpfs:
            - /var/www/html/storage/app/backups:size=10M,mode=777
            - /var/www/html/storage/app/backup-temp:size=2G,mode=777
        volumes:
            - .:/var/www/html
            - ./.docker/php/memory.ini:/usr/local/etc/php/conf.d/memory.ini:ro
        environment:
            - LD_PRELOAD=/usr/lib/libiconv.so.2
            - DB_HOST=db
            - DB_DATABASE=${DB_DATABASE:-unit3d}
            - DB_USERNAME=${DB_USERNAME:-unit3d}
            - DB_PASSWORD=${DB_PASSWORD:-unit3d}
            - REDIS_HOST=redis
            - MEILISEARCH_HOST=http://meilisearch:7700
        depends_on:
            - db
            - redis
            - meilisearch
        networks:
            - unit3d
            - irc_net

    scheduler:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile.app
        container_name: unit3d-staging-scheduler
        restart: unless-stopped
        entrypoint: ["/usr/local/bin/entrypoint-scheduler.sh"]
        tmpfs:
            - /var/www/html/storage/app/backups:size=10M,mode=777
            - /var/www/html/storage/app/backup-temp:size=2G,mode=777
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=db
            - LD_PRELOAD=/usr/lib/libiconv.so.2
            - DB_DATABASE=${DB_DATABASE:-unit3d}
            - DB_USERNAME=${DB_USERNAME:-unit3d}
            - DB_PASSWORD=${DB_PASSWORD:-unit3d}
            - REDIS_HOST=redis
            - MEILISEARCH_HOST=http://meilisearch:7700
        depends_on:
            - db
            - redis
            - meilisearch
        networks:
            - unit3d

    worker:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile.app
        container_name: unit3d-staging-worker
        restart: unless-stopped
        entrypoint: ["/usr/local/bin/entrypoint-worker.sh"]
        tmpfs:
            - /var/www/html/storage/app/backups:size=10M,mode=777
            - /var/www/html/storage/app/backup-temp:size=2G,mode=777
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=db
            - LD_PRELOAD=/usr/lib/libiconv.so.2
            - DB_DATABASE=${DB_DATABASE:-unit3d}
            - DB_USERNAME=${DB_USERNAME:-unit3d}
            - DB_PASSWORD=${DB_PASSWORD:-unit3d}
            - REDIS_HOST=redis
            - MEILISEARCH_HOST=http://meilisearch:7700
            - QUEUE_WORK_QUEUES=default
            - QUEUE_WORK_TIMEOUT=300
        depends_on:
            - db
            - redis
            - meilisearch
        networks:
            - unit3d
            - irc_net

    meta-worker:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile.app
        container_name: unit3d-staging-meta-worker
        restart: unless-stopped
        entrypoint: ["/usr/local/bin/entrypoint-worker.sh"]
        tmpfs:
            - /var/www/html/storage/app/backups:size=10M,mode=777
            - /var/www/html/storage/app/backup-temp:size=2G,mode=777
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=db
            - LD_PRELOAD=/usr/lib/libiconv.so.2
            - DB_DATABASE=${DB_DATABASE:-unit3d}
            - DB_USERNAME=${DB_USERNAME:-unit3d}
            - DB_PASSWORD=${DB_PASSWORD:-unit3d}
            - REDIS_HOST=redis
            - MEILISEARCH_HOST=http://meilisearch:7700
            - QUEUE_WORK_QUEUES=meta-refresh
            - QUEUE_WORK_TIMEOUT=300
        depends_on:
            - db
            - redis
            - meilisearch
        networks:
            - unit3d

    db:
        image: mysql/mysql-server:8.0
        container_name: unit3d-staging-db
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-unit3d}
            - MYSQL_ROOT_HOST=%
            - MYSQL_DATABASE=${DB_DATABASE:-unit3d}
            - MYSQL_USER=${DB_USERNAME:-unit3d}
            - MYSQL_PASSWORD=${DB_PASSWORD:-unit3d}
        volumes:
            - ./.docker/data/mysql:/var/lib/mysql
        networks:
            - unit3d
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-unit3d}"]
            retries: 3
            timeout: 5s

    redis:
        image: redis:alpine
        container_name: unit3d-staging-redis
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - ./.docker/data/redis:/data
        networks:
            - unit3d
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping"]
            retries: 3
            timeout: 5s

    meilisearch:
        image: getmeili/meilisearch:v1.37.0
        container_name: unit3d-staging-meilisearch
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_MEILISEARCH_PORT:-7700}:7700"
        environment:
            - MEILI_NO_ANALYTICS=true
            - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
        volumes:
            - ./.docker/data/meilisearch:/meili_data
        networks:
            - unit3d
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
            retries: 3
            timeout: 5s

    mailpit:
        image: axllent/mailpit:latest
        container_name: unit3d-staging-mailpit
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - unit3d

networks:
    unit3d:
        driver: bridge
    irc_net:
        external: true
